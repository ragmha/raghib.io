name: Build and deploy

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release checks gate what ships with the blog. A PR that only touches agent
  # skills or contributor docs skips them.
  lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.lane.outputs.release }}
    steps:
      - id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          release=true
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
            # ponytail: prefix list; move to a paths-filter action if lanes multiply
            grep -qvE '^(\.agents/|\.impeccable/|\.github/instructions/|(AGENTS|DESIGN|README)\.md$|LICENSE$)' <<< "$files" || release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  seo:
    # The main-branch ruleset requires this exact check name.
    name: SEO readiness
    needs: lanes
    # A job skipped by `if` reports success, so the required check still passes
    # for other lanes (a skipped workflow would stay pending and block merging).
    # If `lanes` fails, its output is empty and the checks run.
    if: ${{ !cancelled() && needs.lanes.outputs.release != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_CF_BEACON_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.CF_WEB_ANALYTICS_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: npx --yes cspell@8.19.4 lint --no-progress
      - run: bun install --frozen-lockfile
      # rehype-mermaid renders diagrams to SVG at build time via headless
      # Chromium, so the browser must be present before `bun run build`.
      - run: bunx playwright install --with-deps chromium
      # PowerShell cold starts on the runner can exceed Bun's 5s default.
      - run: bun test --bail --timeout 20000
      - run: bun run build
      - run: bun run check:seo
      - run: bun run check:vitals

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: seo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
