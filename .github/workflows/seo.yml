name: SEO readiness

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: SEO readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile
      - run: bun test --bail
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:seo
      - run: bun run check:vitals
